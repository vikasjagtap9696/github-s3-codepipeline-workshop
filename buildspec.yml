
version: 0.2

phases:
  install:
    commands:
      - echo "No installation needed for static HTML"

  pre_build:
    commands:
      - echo "Preparing build..."

  build:
    commands:
      - echo "Building static HTML website"
      - mkdir -p output
      - find . -mindepth 1 -maxdepth 1 ! -name output ! -name .git ! -name buildspec.yml -exec cp -a {} output/ \;
      - echo "Website files copied successfully"
      - ls -la output/

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - '**/*'
  base-directory: output
  discard-paths: no
